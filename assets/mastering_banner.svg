<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="eqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b162c"/>
      <stop offset="50%" stop-color="#102347"/>
      <stop offset="100%" stop-color="#060c1a"/>
    </linearGradient>
    <linearGradient id="eqWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
    <filter id="eqGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="240" rx="16" fill="url(#eqBg)" stroke="rgba(0, 242, 254, 0.45)" stroke-width="1.5"/>

  <!-- Spectral Grid Lines -->
  <line x1="100" y1="90" x2="700" y2="90" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <line x1="100" y1="130" x2="700" y2="130" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <line x1="100" y1="170" x2="700" y2="170" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <line x1="100" y1="210" x2="700" y2="210" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>

  <!-- Frequency Grid Vertical Lines -->
  <line x1="200" y1="80" x2="200" y2="210" stroke="rgba(0, 242, 254, 0.12)" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="350" y1="80" x2="350" y2="210" stroke="rgba(0, 242, 254, 0.12)" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="500" y1="80" x2="500" y2="210" stroke="rgba(0, 242, 254, 0.12)" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="650" y1="80" x2="650" y2="210" stroke="rgba(0, 242, 254, 0.12)" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Glowing Analogue Bell Curve & Harmonic Wave -->
  <path d="M 100 210 Q 180 200, 220 130 T 360 170 T 490 100 T 630 190 T 700 210" fill="none" stroke="url(#eqWave)" stroke-width="4" stroke-linecap="round" filter="url(#eqGlow)"/>

  <!-- Peak Control Nodes -->
  <circle cx="220" cy="130" r="7" fill="#00f2fe" filter="url(#eqGlow)"/>
  <circle cx="360" cy="170" r="6" fill="#00ff88" filter="url(#eqGlow)"/>
  <circle cx="490" cy="100" r="8" fill="#ffd700" filter="url(#eqGlow)"/>
  <circle cx="630" cy="190" r="6" fill="#ff007f" filter="url(#eqGlow)"/>

  <!-- Frequency Axis Labels -->
  <text x="220" y="225" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00f2fe" text-anchor="middle">80 Hz (Bass)</text>
  <text x="360" y="225" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00ff88" text-anchor="middle">1 kHz (Mid)</text>
  <text x="490" y="225" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ffd700" text-anchor="middle">12 kHz (Air)</text>
  <text x="630" y="225" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ff007f" text-anchor="middle">20 kHz (Ultra)</text>

  <!-- Title Badge -->
  <g transform="translate(400, 42)">
    <text x="0" y="0" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="900" fill="#00f2fe" text-anchor="middle" letter-spacing="2">MASTERING LAB & ÉGALISATION ANALOGIQUE</text>
    <text x="0" y="22" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" fill="#93c5fd" text-anchor="middle" letter-spacing="1">CALIBRATION DE PRÉCISION • JUSQU'À X2.5 DE PRODUCTION</text>
  </g>
</svg>
