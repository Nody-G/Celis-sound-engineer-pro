<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="spaceGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#190d2e"/>
      <stop offset="50%" stop-color="#0a0518"/>
      <stop offset="100%" stop-color="#020008"/>
    </radialGradient>
    <linearGradient id="stationGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="solarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="neonOrbital" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Cosmos Background -->
  <rect width="512" height="512" rx="32" fill="url(#spaceGrad)"/>

  <!-- Distant Earth Horizon Curve -->
  <path d="M-50 480 Q 256 320, 562 480 L 562 550 L -50 550 Z" fill="#0f2b5c" opacity="0.85"/>
  <path d="M-50 480 Q 256 320, 562 480" fill="none" stroke="#00f2fe" stroke-width="4" filter="url(#neonOrbital)"/>

  <!-- Stars & Nebula Clouds -->
  <circle cx="90" cy="80" r="1.5" fill="#fff" opacity="0.9"/>
  <circle cx="160" cy="140" r="2" fill="#ff007f" opacity="0.7"/>
  <circle cx="430" cy="70" r="2.5" fill="#ffd700" opacity="0.8"/>
  <circle cx="380" cy="160" r="1.5" fill="#00ff88" opacity="0.8"/>
  <circle cx="70" cy="280" r="2" fill="#00f2fe" opacity="0.7"/>
  <circle cx="460" cy="290" r="1.5" fill="#fff" opacity="0.8"/>

  <!-- Orbital Gravity Ring Module (Dolby Atmos 360 Acoustic Torus) -->
  <ellipse cx="256" cy="220" rx="160" ry="60" fill="none" stroke="#475569" stroke-width="20" opacity="0.9"/>
  <ellipse cx="256" cy="220" rx="160" ry="60" fill="none" stroke="#00f2fe" stroke-width="4" stroke-dasharray="16 8" filter="url(#neonOrbital)"/>
  
  <!-- Central Sound Station Hub -->
  <rect x="236" y="140" width="40" height="160" rx="10" fill="url(#stationGrad)" stroke="#00f2fe" stroke-width="2"/>
  <circle cx="256" cy="220" r="32" fill="#1e293b" stroke="#ffd700" stroke-width="3" filter="url(#neonOrbital)"/>
  <circle cx="256" cy="220" r="18" fill="#ffd700" opacity="0.9"/>

  <!-- Giant Solar Acoustic Panels -->
  <!-- Left Solar Array -->
  <rect x="50" y="195" width="110" height="50" rx="4" fill="url(#solarGrad)" stroke="#60a5fa" stroke-width="2" filter="url(#neonOrbital)"/>
  <line x1="160" y1="220" x2="236" y2="220" stroke="#94a3b8" stroke-width="6"/>
  <line x1="86" y1="195" x2="86" y2="245" stroke="#1e3a8a" stroke-width="1.5"/>
  <line x1="123" y1="195" x2="123" y2="245" stroke="#1e3a8a" stroke-width="1.5"/>

  <!-- Right Solar Array -->
  <rect x="352" y="195" width="110" height="50" rx="4" fill="url(#solarGrad)" stroke="#60a5fa" stroke-width="2" filter="url(#neonOrbital)"/>
  <line x1="276" y1="220" x2="352" y2="220" stroke="#94a3b8" stroke-width="6"/>
  <line x1="388" y1="195" x2="388" y2="245" stroke="#1e3a8a" stroke-width="1.5"/>
  <line x1="425" y1="195" x2="425" y2="245" stroke="#1e3a8a" stroke-width="1.5"/>

  <!-- Communications & Sonic Emitters (Top Antenna & Laser Array) -->
  <line x1="256" y1="140" x2="256" y2="70" stroke="#e2e8f0" stroke-width="3"/>
  <circle cx="256" cy="65" r="7" fill="#ff007f" filter="url(#neonOrbital)"/>
  <circle cx="256" cy="65" r="16" fill="none" stroke="#ff007f" stroke-width="2" opacity="0.6"/>

  <!-- Spherical Soundwaves radiating into Space -->
  <path d="M 180 80 Q 256 40, 332 80" fill="none" stroke="#00f2fe" stroke-width="2.5" opacity="0.7" filter="url(#neonOrbital)"/>
  <path d="M 150 60 Q 256 15, 362 60" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.5"/>

  <!-- Station Label Badge -->
  <g transform="translate(156, 440)">
    <rect x="-40" y="-18" width="280" height="36" rx="18" fill="rgba(255, 0, 127, 0.15)" stroke="#ff007f" stroke-width="1.5"/>
    <text x="100" y="5" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" fill="#ff007f" text-anchor="middle" letter-spacing="2">ZERO-G SOUND STATION</text>
  </g>
</svg>
