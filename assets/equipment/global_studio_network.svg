<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141c38"/>
      <stop offset="60%" stop-color="#090d1f"/>
      <stop offset="100%" stop-color="#04060d"/>
    </radialGradient>
    <radialGradient id="globeGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="85%" stop-color="#122b5e"/>
      <stop offset="100%" stop-color="#081026"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="32" fill="url(#bgGrad)"/>

  <!-- Starfield & Data Grid -->
  <circle cx="80" cy="90" r="2" fill="#00f2fe" opacity="0.6"/>
  <circle cx="420" cy="110" r="2.5" fill="#ffd700" opacity="0.7"/>
  <circle cx="120" cy="400" r="2" fill="#ff007f" opacity="0.5"/>
  <circle cx="440" cy="380" r="2" fill="#00ff88" opacity="0.8"/>
  <circle cx="260" cy="50" r="1.5" fill="#fff" opacity="0.9"/>

  <!-- Orbital Rings -->
  <ellipse cx="256" cy="256" rx="210" ry="85" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-dasharray="10 8" opacity="0.4" transform="rotate(-25 256 256)"/>
  <ellipse cx="256" cy="256" rx="230" ry="95" fill="none" stroke="#ff007f" stroke-width="2" stroke-dasharray="6 12" opacity="0.35" transform="rotate(35 256 256)"/>

  <!-- Glowing Cyber Globe -->
  <circle cx="256" cy="256" r="140" fill="url(#globeGrad)" filter="url(#neonGlow)"/>

  <!-- Longitude & Latitude Holographic Lines -->
  <ellipse cx="256" cy="256" rx="140" ry="60" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.45"/>
  <ellipse cx="256" cy="256" rx="140" ry="110" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.35"/>
  <line x1="256" y1="116" x2="256" y2="396" stroke="#00f2fe" stroke-width="2" opacity="0.45"/>
  <ellipse cx="256" cy="256" rx="70" ry="140" fill="none" stroke="#00f2fe" stroke-width="1.8" opacity="0.35"/>

  <!-- Studio Hub Nodes with Beams -->
  <!-- Tokyo Hub -->
  <circle cx="340" cy="210" r="8" fill="#ffd700" filter="url(#neonGlow)"/>
  <circle cx="340" cy="210" r="16" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.7"/>
  <!-- London Hub -->
  <circle cx="210" cy="180" r="7" fill="#00ff88" filter="url(#neonGlow)"/>
  <!-- LA Hub -->
  <circle cx="160" cy="230" r="8" fill="#ff007f" filter="url(#neonGlow)"/>
  <circle cx="160" cy="230" r="15" fill="none" stroke="#ff007f" stroke-width="2" opacity="0.7"/>
  <!-- Sydney Hub -->
  <circle cx="350" cy="320" r="6" fill="#00f2fe" filter="url(#neonGlow)"/>
  <!-- Paris Hub -->
  <circle cx="235" cy="195" r="7" fill="#ffd700" filter="url(#neonGlow)"/>

  <!-- Interconnecting Soundwave Data Streams -->
  <path d="M160 230 Q 185 180, 210 180" fill="none" stroke="#ffd700" stroke-width="3" stroke-linecap="round" filter="url(#neonGlow)"/>
  <path d="M210 180 Q 275 160, 340 210" fill="none" stroke="#00f2fe" stroke-width="3.5" stroke-linecap="round" filter="url(#neonGlow)"/>
  <path d="M340 210 Q 380 270, 350 320" fill="none" stroke="#00ff88" stroke-width="2.5" stroke-linecap="round" filter="url(#neonGlow)"/>
  <path d="M160 230 Q 250 340, 350 320" fill="none" stroke="#ff007f" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round"/>

  <!-- Satellite Station -->
  <g transform="translate(380, 100) scale(0.6)">
    <rect x="-20" y="-12" width="40" height="24" rx="4" fill="#2d3748" stroke="#00f2fe" stroke-width="2"/>
    <rect x="-60" y="-8" width="35" height="16" fill="#00f2fe" opacity="0.8"/>
    <rect x="25" y="-8" width="35" height="16" fill="#00f2fe" opacity="0.8"/>
    <line x1="0" y1="12" x2="-20" y2="40" stroke="#ffd700" stroke-width="2" stroke-dasharray="4 4"/>
  </g>

  <!-- Audio Wave Overlay Banner -->
  <g transform="translate(156, 440)">
    <rect x="-40" y="-18" width="280" height="36" rx="18" fill="rgba(0, 242, 254, 0.15)" stroke="#00f2fe" stroke-width="1.5"/>
    <text x="100" y="5" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" fill="#00f2fe" text-anchor="middle" letter-spacing="2">GLOBAL AUDIO NETWORK</text>
  </g>
</svg>
